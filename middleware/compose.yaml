services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Password@123
    volumes:
      - ./mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command:
      [ "redis-server", "--requirepass", "Password@123" ]
  nacos:
    image: nacos/nacos-server:v3.2.3
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - NACOS_AUTH_TOKEN=SL85c2q9AyZWbTutOt+QrF7WeCONXeYb8IwvIN5wkKI=
      - NACOS_AUTH_IDENTITY_KEY=NACOS_AUTH_IDENTITY_KEY
      - NACOS_AUTH_IDENTITY_VALUE=eb27213d39e0764c3f7f36afd73cc024
