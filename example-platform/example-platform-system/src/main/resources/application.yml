server:
  port: 8079

spring:
  application:
    name: example-platform-system
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
  config:
    import:
      - application-spring.yml
      - optional:nacos:example-platform-common.yml
      - optional:nacos:example-platform-system.yml
